name: Lint

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install shellcheck
      run: |
        sudo apt-get update
        sudo apt-get install -y shellcheck
        
    - name: Run lint
      run: make lint

  test-llm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run LLM catalog tests
      run: make test-llm 